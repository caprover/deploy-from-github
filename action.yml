name: "Deploy Github repo to Caprover"
description: "Github Action for deploying your app to Caprover."
author: "Caprover Contributors"

inputs:
  server:
    description: "CapRover server URL, i.e. https://captain.apps.your-domain.com."
    required: true
  token:
    description: "App Token"
    required: true
  app:
    description: "App Name"
    required: true
  branch:
    description: "Branch to be deployed"
    required: false
  image:
    description: "Docker image to be deployed"
    required: false

runs:
  using: "node24"
  main: "dist/index.js"
