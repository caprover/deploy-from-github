name: "Deploy to CapRover"
description: "Deploy checked-out source, a Docker image, or a prepared tar to CapRover."
author: "CapRover Contributors"

inputs:
  server:
    description: "CapRover server URL, i.e. https://captain.apps.your-domain.com."
    required: true
  token:
    description: "App Token"
    required: true
  app:
    description: "App Name"
    required: true
  image:
    description: "Docker image to be deployed"
    required: false
  tar-file:
    description: "Prepared deployment tar file, relative to the GitHub workspace"
    required: false
  working-directory:
    description: "Directory within the checked-out repository to deploy"
    required: false
    default: "."

runs:
  using: "node24"
  main: "dist/index.js"
